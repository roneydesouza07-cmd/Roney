<!doctype html>
<html lang="pt-BR" data-app-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Brick</title>
<meta name="description" content="Gestão de revenda: compras, vendas, lucro e estoque.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brick">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #e4e7ec;
  --text: #0f1729;
  --text-2: #4b5565;
  --text-3: #8a93a3;
  --accent: #2563eb;
  --accent-soft: #e8efff;
  --on-accent: #ffffff;
  --good: #0a8a4b;
  --good-soft: #e5f6ec;
  --bad: #d23a3a;
  --bad-soft: #fdeaea;
  --warn: #b26b00;
  --warn-soft: #fff3dc;
  --s1: #2a78d6;
  --s2: #1baf7a;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --radius: 16px;
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
:root[data-app-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0c0f;
  --surface: #15171c;
  --surface-2: #1d2027;
  --border: #2a2e37;
  --text: #f2f4f7;
  --text-2: #b3bac6;
  --text-3: #7c8594;
  --accent: #4f8bff;
  --accent-soft: #1a2640;
  --on-accent: #ffffff;
  --good: #2fc77a;
  --good-soft: #10291c;
  --bad: #ff6b6b;
  --bad-soft: #321616;
  --warn: #f0a63a;
  --warn-soft: #2e2210;
  --s1: #3987e5;
  --s2: #199e70;
  --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100dvh;
  padding-bottom: calc(var(--tabbar-h) + var(--safe-b) + 24px);
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px);
  padding-block: calc(var(--safe-t) + 12px) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.top h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
.top .sub { font-size: 13px; color: var(--text-3); }
main { padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 720px; margin: 0 auto; }
.view { display: none; }
.view.active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }

/* Segmented / chips */
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; margin-bottom: 14px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px 12px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--border); background: var(--surface); padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.chip .c { opacity: .6; margin-left: 4px; font-weight: 500; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 .link { font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; }
.label { font-size: 12px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.hero { padding: 20px 16px; }
.hero .big { font-size: 38px; font-weight: 750; letter-spacing: -.03em; margin: 4px 0 6px; }
.hero .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--text-2); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--text-2); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile .v { font-size: 19px; font-weight: 700; margin-top: 4px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .h { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); gap: 12px; }
.kv:first-of-type { border-top: 0; }
.kv span:first-child { color: var(--text-2); }
.kv b { font-weight: 650; }
.progress { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 10px 0 6px; }
.progress > div { height: 100%; background: var(--good); border-radius: 999px; transition: width .4s ease; }

/* Product list */
.search { display: flex; gap: 8px; margin-bottom: 12px; }
.search input, .search select { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 11px 12px; outline: none; }
.search select { flex: none; width: auto; }
.search input:focus { border-color: var(--accent); }
.plist { display: flex; flex-direction: column; gap: 8px; }
.pitem { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
.thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--surface-2); flex: none; object-fit: cover; display: grid; place-items: center; color: var(--text-3); font-weight: 700; font-size: 18px; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.pbody { flex: 1; min-width: 0; }
.pname { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pmeta { font-size: 12.5px; color: var(--text-2); margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pmeta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
.pnums { font-size: 12.5px; margin-top: 4px; display: flex; gap: 4px 10px; flex-wrap: wrap; }
.pnums span { white-space: nowrap; }
.check { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); flex: none; display: grid; place-items: center; color: transparent; transition: all .15s; }
.check.done { background: var(--good); border-color: var(--good); color: #fff; }
.check svg { width: 20px; height: 20px; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
.st-estoque { background: var(--surface-2); color: var(--text-2); }
.st-anunciado { background: var(--accent-soft); color: var(--accent); }
.st-reservado { background: var(--warn-soft); color: var(--warn); }
.st-vendido { background: var(--good-soft); color: var(--good); }
.empty { text-align: center; color: var(--text-3); padding: 40px 16px; }
.empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

/* Lists */
.row-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.row-item:first-child { border-top: 0; }
.row-item .grow { flex: 1; min-width: 0; }
.row-item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .s { font-size: 12.5px; color: var(--text-3); }
.row-item .r { text-align: right; font-weight: 650; white-space: nowrap; }

/* Bars (categories) */
.hbar { margin: 10px 0; }
.hbar .top-l { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; gap: 8px; }
.hbar .top-l span:first-child { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.hbar .fill.neg { background: var(--bad); }

/* Chart */
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 8px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, 0); opacity: 0; transition: opacity .12s; z-index: 2; }
.tip.show { opacity: 1; }
.tip b { display: block; margin-bottom: 2px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { padding: 8px 4px; text-align: right; border-top: 1px solid var(--border); white-space: nowrap; }
table.t th { color: var(--text-3); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; border-top: 0; }
table.t td:first-child, table.t th:first-child { text-align: left; }
.scroll-x { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-b); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  display: grid; grid-template-columns: repeat(5, 1fr); height: calc(var(--tabbar-h) + var(--safe-b));
}
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text-3); }
.tabbar button.on { color: var(--accent); }
.tabbar svg { width: 24px; height: 24px; }
.tabbar .add { position: relative; }
.tabbar .add span { width: 52px; height: 52px; border-radius: 18px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(37,99,235,.35); }
.tabbar .add svg { width: 28px; height: 28px; }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(10,14,22,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 92dvh; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0; padding-block: 8px calc(20px + var(--safe-b)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-width: 720px; margin: 0 auto;
}
.sheet.show { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 4px auto 12px; }
.sheet h3 { margin: 0 0 14px; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
.sheet h3 button { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--text-2); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px; outline: none; font-size: 16px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { min-height: 70px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.money { position: relative; }
.money::before { content: "R$"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 15px; pointer-events: none; }
.money input { padding-left: 38px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.section-t { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 10px; }
.preview { background: var(--surface-2); border-radius: 12px; padding: 12px; font-size: 14px; margin: 6px 0 14px; }
.preview .kv { padding: 5px 0; border: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--surface-2); color: var(--text); }
.btn.good { background: var(--good); color: #fff; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.small { padding: 10px 12px; font-size: 14px; border-radius: 12px; width: auto; }
.btns { display: flex; gap: 8px; margin-top: 8px; }
.btns .btn { flex: 1; }
.stack > * + * { margin-top: 8px; }
.photo-pick { display: flex; gap: 12px; align-items: center; }
.photo-pick .thumb { width: 72px; height: 72px; }
.seg-inline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg-inline button { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 2px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.seg-inline button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.detail-photo { width: 100%; max-height: 280px; object-fit: cover; border-radius: 14px; margin-bottom: 12px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-b) + 14px); transform: translate(-50%, 20px); background: var(--text); color: var(--bg); padding: 11px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 60; opacity: 0; pointer-events: none; transition: all .2s; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 800; padding: 0; }
:root[data-app-theme="light"] .toast button { color: #8fb4ff; }
.alert { display: flex; gap: 10px; align-items: flex-start; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 12px; font-weight: 600; border: 0; width: 100%; text-align: left; }
.alert svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
.muted { color: var(--text-3); }
.small { font-size: 12.5px; }
.mt0 { margin-top: 0; }
@media (min-width: 560px) { .grid.g3 { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>

    <div class="sub" id="hdrSub">Gestão de revenda</div>

<main>

<nav class="tabbar" id="tabbar">
  <button data-v="painel" class="on" aria-label="Painel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    Painel
  </button>
  <button data-v="produtos" aria-label="Produtos">

  </button>

  </button>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M16 15h2"/></svg>
    Caixa

</nav>

<div class="backdrop" id="backdrop"></div>

<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   Storage (IndexedDB com fallback para localStorage)
   ========================================================= */
const DB_NAME = 'brick-db', STORE = 'kv', KEY = 'state';
let dbp = null;
function idb() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej('no idb');
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function loadState() {
  try {
    const db = await idb();
    const v = await new Promise((res, rej) => {
      const t = db.transaction(STORE).objectStore(STORE).get(KEY);
      t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
    });
    if (v) return v;
  } catch (e) {}
  try { const s = localStorage.getItem('brick-state'); if (s) return JSON.parse(s); } catch (e) {}
  return null;
}
let saveTimer = null;
function saveLocal() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const db = await idb();
      db.transaction(STORE, 'readwrite').objectStore(STORE).put(S, KEY);
    } catch (e) {
      try { localStorage.setItem('brick-state', JSON.stringify(S)); } catch (e2) { toast('Não foi possível salvar — memória cheia?'); }
    }
  }, 150);
}

/* Sincronização com a nuvem (quando aberto no claude.ai).
   Cada produto e cada movimentação de caixa é um documento; só o que mudou é gravado. */
let remote = null;
let loading = false;
let localBackup = null;
const synced = { products: new Map(), cash: new Map(), settings: '' };
let writeChain = Promise.resolve();
function queueWrite(fn) {
  writeChain = writeChain.then(fn).catch(err => {
    console.error(err);
    toast(err && err.code === 'quota_exceeded' ? 'Espaço na nuvem cheio. Exclua fotos ou produtos antigos.' : 'Não foi possível salvar na nuvem. Tente de novo.');
  });
}
function syncRemote() {
  for (const [col, list] of [['products', S.products], ['cash', S.cash]]) {
    const seen = new Set();
    for (const item of list) {
      seen.add(item.id);
      const j = JSON.stringify(item);
      if (synced[col].get(item.id) !== j) {
        synced[col].set(item.id, j);
        const body = JSON.parse(j);
        queueWrite(() => remote.collection(col).doc(item.id).set(body));
      }
    }
    for (const id of [...synced[col].keys()]) {
      if (!seen.has(id)) { synced[col].delete(id); queueWrite(() => remote.collection(col).doc(id).delete()); }
    }
  }
  const sj = JSON.stringify(S.settings);
  if (sj !== synced.settings) { synced.settings = sj; const body = JSON.parse(sj); queueWrite(() => remote.doc('config/settings').set(body)); }
}
function save() { if (remote) syncRemote(); else saveLocal(); }

async function connectRemote() {
  if (!window.claude || typeof window.claude.use !== 'function') return false;
  let db = null;
  try { db = await window.claude.use('db'); } catch (e) {}
  if (!db) return false;
  remote = db;
  loading = true; render();
  const got = { products: false, cash: false, settings: false };
  const timer = setTimeout(() => { if (loading) { loading = false; render(); toast('Sem conexão com a nuvem ainda. Os dados aparecem quando conectar.'); } }, 10000);
  const done = () => {
    if (got.products && got.cash && got.settings && loading) {
      loading = false; clearTimeout(timer);
      migrateLocal();
      applyTheme(); render();
    }
  };
  const onCol = col => snap => {
    const items = snap.docs.map(d => JSON.parse(JSON.stringify(d.data())));
    synced[col] = new Map(items.map(it => [it.id, JSON.stringify(it)]));
    S[col] = col === 'products' ? items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : items;
    if (!snap.metadata.fromCache) got[col] = true;
    if (!loading) render(); else done();
  };
  const onErr = e => { console.error(e); clearTimeout(timer); loading = false; render(); toast('Erro ao carregar os dados da nuvem.'); };
  db.collection('products').onSnapshot(onCol('products'), onErr);
  db.collection('cash').onSnapshot(onCol('cash'), onErr);
  db.doc('config/settings').onSnapshot(snap => {
    if (snap.exists) { const d = JSON.parse(JSON.stringify(snap.data())); synced.settings = JSON.stringify(d); S.settings = { ...S.settings, ...d }; applyTheme(); }
    if (!snap.metadata.fromCache) got.settings = true;
    if (!loading) render(); else done();
  }, onErr);
  return true;
}
function migrateLocal() {
  // dados que estavam só neste navegador sobem para a nuvem se ela estiver vazia
  if (localBackup && localBackup.products && localBackup.products.length && !S.products.length) {
    S.products = localBackup.products; S.cash = localBackup.cash || [];
    S.settings = { ...S.settings, ...(localBackup.settings || {}) };
    syncRemote();
  }
}

/* =========================================================
   Utilidades
   ========================================================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const BRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const fmt = v => BRL.format(v || 0);
const fmtK = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (a >= 1e4) return 'R$ ' + (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
  return BRL0.format(v);
};
const pct = v => (isFinite(v) ? (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' : '—');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function parseMoney(s) {
  if (typeof s === 'number') return s;
  s = String(s || '').replace(/[R$\s]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? Math.round(n * 100) / 100 : 0;
}
const moneyIn = v => (v ? String(v).replace('.', ',') : '');
function todayStr() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysBetween = (a, b) => Math.max(0, Math.round((toDate(b) - toDate(a)) / 864e5));
const fmtDate = s => s ? toDate(s).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '') : '';
const fmtDateLong = s => s ? toDate(s).toLocaleDateString('pt-BR') : '';
const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const ym = s => s.slice(0, 7);
const ymLabel = k => { const [y, m] = k.split('-'); return MONTHS[+m - 1] + '/' + y.slice(2); };

const cost = p => (p.buyPrice || 0) + (p.extraCost || 0);
const net = p => (p.sellPrice || 0) - (p.sellFee || 0);
const profit = p => net(p) - cost(p);
const isSold = p => p.status === 'vendido';
const age = p => daysBetween(p.buyDate || todayStr(), isSold(p) ? (p.sellDate || todayStr()) : todayStr());

/* Períodos */
function periodRange(p, offset = 0) {
  const t = toDate(todayStr());
  if (p === 'mes') {
    const a = new Date(t.getFullYear(), t.getMonth() - offset, 1);
    const b = offset ? new Date(t.getFullYear(), t.getMonth() - offset + 1, 0) : t;
    return [a, b];
  }
  if (p === '30d') {
    const b = new Date(t); b.setDate(b.getDate() - 30 * offset);
    const a = new Date(b); a.setDate(a.getDate() - 29);
    return [a, b];
  }
  if (p === 'ano') return [new Date(t.getFullYear() - offset, 0, 1), offset ? new Date(t.getFullYear() - offset, 11, 31) : t];
  return [new Date(2000, 0, 1), new Date(2999, 0, 1)];
}
const inRange = (s, [a, b]) => s && toDate(s) >= a && toDate(s) <= b;

function stats(range) {
  const sold = S.products.filter(p => isSold(p) && inRange(p.sellDate, range));
  const bought = S.products.filter(p => inRange(p.buyDate, range));
  const revenue = sold.reduce((s, p) => s + (p.sellPrice || 0), 0);
  const fees = sold.reduce((s, p) => s + (p.sellFee || 0), 0);
  const soldCost = sold.reduce((s, p) => s + cost(p), 0);
  const prof = revenue - fees - soldCost;
  const invested = bought.reduce((s, p) => s + cost(p), 0);
  const days = sold.map(age);
  return {
    sold, bought, revenue, fees, soldCost, profit: prof, invested,
    count: sold.length,
    ticket: sold.length ? revenue / sold.length : 0,
    avgProfit: sold.length ? prof / sold.length : 0,
    margin: revenue ? prof / revenue : NaN,
    roi: soldCost ? prof / soldCost : NaN,
    avgDays: days.length ? days.reduce((a, b) => a + b, 0) / days.length : NaN
  };
}
function stock() {
  const items = S.products.filter(p => !isSold(p));
  const capital = items.reduce((s, p) => s + cost(p), 0);
  const listed = items.reduce((s, p) => s + (p.listPrice || 0), 0);
  const withPrice = items.filter(p => p.listPrice);
  const potential = withPrice.reduce((s, p) => s + p.listPrice - cost(p), 0);
  const stale = items.filter(p => age(p) >= (S.settings.staleDays || 30));
  return { items, capital, listed, potential, stale };
}
function cashBalance() {
  const aportes = S.cash.filter(c => c.type === 'aporte').reduce((s, c) => s + c.amount, 0);
  const retiradas = S.cash.filter(c => c.type === 'retirada').reduce((s, c) => s + c.amount, 0);
  const compras = S.products.reduce((s, p) => s + cost(p), 0);
  const vendas = S.products.filter(isSold).reduce((s, p) => s + net(p), 0);
  return { aportes, retiradas, compras, vendas, saldo: aportes - retiradas - compras + vendas };
}
function delta(cur, prev) {
  if (!prev) return '';
  const d = (cur - prev) / Math.abs(prev);
  const cls = d >= 0 ? 'good' : 'bad';
  return `<span class="pill ${cls}">${d >= 0 ? '▲' : '▼'} ${pct(Math.abs(d))}</span>`;
}

function thumb(p, size = 56) {
  const st = `style="width:${size}px;height:${size}px"`;
  if (p.photo) return `<div class="thumb" ${st}><img src="${p.photo}" alt=""></div>`;
  const ini = (p.name || '?').trim().slice(0, 1).toUpperCase();
  return `<div class="thumb" ${st}>${esc(ini)}</div>`;
}
function setStatus(s) { ui.status = s; renderProducts(); }
function renderProducts() {
  const counts = { todos: S.products.length, abertos: 0, estoque: 0, anunciado: 0, reservado: 0, vendido: 0, parados: 0 };
  const staleD = S.settings.staleDays || 30;
  S.products.forEach(p => { counts[p.status]++; if (!isSold(p)) { counts.abertos++; if (age(p) >= staleD) counts.parados++; } });
  const chipDefs = [['todos', 'Todos'], ['abertos', 'À venda'], ['anunciado', 'Anunciados'], ['estoque', 'Em estoque'], ['reservado', 'Reservados'], ['vendido', 'Vendidos'], ['parados', 'Parados']];
  $('#statusChips').innerHTML = chipDefs.filter(([k]) => k !== 'parados' || counts.parados).map(([k, l]) =>
    `<button class="chip ${ui.status === k ? 'on' : ''}" onclick="setStatus('${k}')">${l}<span class="c">${counts[k]}</span></button>`).join('');

  let list = S.products.slice();
  if (ui.status === 'abertos') list = list.filter(p => !isSold(p));
  else if (ui.status === 'parados') list = list.filter(p => !isSold(p) && age(p) >= staleD);
  else if (ui.status !== 'todos') list = list.filter(p => p.status === ui.status);
  const q = ui.q.trim().toLowerCase();
  if (q) list = list.filter(p => [p.name, p.category, p.platform, p.notes, p.buyer].join(' ').toLowerCase().includes(q));
  const sorters = {
    recent: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
    old: (a, b) => (a.buyDate || '').localeCompare(b.buyDate || ''),
    profit: (a, b) => expProfit(b) - expProfit(a),
    price: (a, b) => (b.sellPrice || b.listPrice || 0) - (a.sellPrice || a.listPrice || 0),
    name: (a, b) => a.name.localeCompare(b.name, 'pt-BR')
  };
  list.sort(sorters[ui.sort]);

  if (!list.length) {
    $('#plist').innerHTML = S.products.length
      ? `<div class="empty"><b>Nada por aqui</b>Nenhum produto com esse filtro.</div>`
      : `<div class="empty"><b>Nenhum produto ainda</b>Toque no <b style="display:inline;color:var(--accent)">+</b> para cadastrar o primeiro.</div>`;
    return;
  }
  $('#plist').innerHTML = list.map(p => {
    const sold = isSold(p);
    const pr = expProfit(p);
    const priceTxt = sold ? `Vendido ${fmt(p.sellPrice)}` : (p.listPrice ? `Anúncio ${fmt(p.listPrice)}` : 'Sem preço');
    return `
    <div class="pitem">
      <div onclick="openDetail('${p.id}')" style="display:flex;gap:12px;align-items:center;flex:1;min-width:0">
        ${thumb(p)}
        <div class="pbody">
          <div class="pname">${esc(p.name)}</div>
          <div class="pmeta"><span class="badge st-${p.status}">${STATUS[p.status]}</span>${p.category ? `<span>${esc(p.category)}</span>` : ''}<span class="dot"></span><span>${age(p)}d</span></div>
          <div class="pnums num"><span class="muted">Custo ${fmt(cost(p))}</span><span>${priceTxt}</span></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <button class="check ${sold ? 'done' : ''}" aria-label="${sold ? 'Vendido' : 'Marcar como vendido'}" onclick="toggleSold('${p.id}')">${ICON_CHECK}</button>
        ${(sold || p.listPrice) ? `<span class="small num ${pr >= 0 ? 'pos' : 'neg'}" style="font-weight:700">${pr >= 0 ? '+' : ''}${fmtK(pr)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}
const expProfit = p => isSold(p) ? profit(p) : (p.listPrice ? p.listPrice - cost(p) : -Infinity);

/* =========================================================
   Render: Relatórios
   ========================================================= */
function monthlySeries(n = 6) {
  const t = toDate(todayStr());
  const keys = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(t.getFullYear(), t.getMonth() - i, 1);
    keys.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return keys.map(k => {
    const sold = S.products.filter(p => isSold(p) && p.sellDate && ym(p.sellDate) === k);
    const bought = S.products.filter(p => p.buyDate && ym(p.buyDate) === k);
    const rev = sold.reduce((s, p) => s + (p.sellPrice || 0), 0);
    const pr = sold.reduce((s, p) => s + profit(p), 0);
    return { k, label: ymLabel(k), rev, profit: pr, inv: bought.reduce((s, p) => s + cost(p), 0), count: sold.length, bought: bought.length };
  });
}
function niceMax(v) {
  if (v <= 0) return 100;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
function barPath(x, y0, w, y1, r) {
  // barra com ponta arredondada no lado oposto à linha de base
  const h = Math.abs(y1 - y0);
  r = Math.min(r, w / 2, h);
  if (h < 0.5) return '';
  if (y1 < y0) return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
  return `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
}
function monthlyChart(data) {
  const W = 340, H = 200, padL = 44, padR = 4, padT = 10, padB = 24;
  const maxV = niceMax(Math.max(...data.map(d => Math.max(d.rev, d.profit)), 0));
  const minRaw = Math.min(0, ...data.map(d => d.profit));
  const minV = minRaw < 0 ? -niceMax(-minRaw) : 0;
  const y = v => padT + (maxV - v) / (maxV - minV) * (H - padT - padB);
  const gw = (W - padL - padR) / data.length;
  const bw = Math.min(18, (gw - 14) / 2);
  let g = '';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = minV + (maxV - minV) * i / ticks;
    g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1" ${Math.abs(v) < 1e-9 ? '' : 'stroke-dasharray="2 3"'}/>`;
    g += `<text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--text-3)">${fmtK(v).replace('R$ ', '')}</text>`;
  }
  data.forEach((d, i) => {
    const cx = padL + gw * i + gw / 2;
    const x1 = cx - bw - 1, x2 = cx + 1;
    g += `<path d="${barPath(x1, y(0), bw, y(d.rev), 4)}" fill="var(--s1)"/>`;
    g += `<path d="${barPath(x2, y(0), bw, y(d.profit), 4)}" fill="${d.profit < 0 ? 'var(--bad)' : 'var(--s2)'}"/>`;
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--text-3)">${d.label.split('/')[0]}</text>`;
    g += `<rect x="${padL + gw * i}" y="${padT}" width="${gw}" height="${H - padT - padB}" fill="transparent" data-i="${i}" class="hit"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturamento e lucro por mês">${g}</svg>`;
}
function bindChartTips(wrap, data) {
  const tip = wrap.querySelector('.tip');
  const show = e => {
    const i = +e.target.dataset.i;
    const d = data[i];
    const box = wrap.getBoundingClientRect();
    const r = e.target.getBoundingClientRect();
    tip.innerHTML = `<b>${d.label}</b>Faturamento ${fmt(d.rev)}<br>Lucro ${fmt(d.profit)}<br>${d.count} vendas · investido ${fmt(d.inv)}`;
    let x = r.left - box.left + r.width / 2;
    x = Math.max(90, Math.min(box.width - 90, x));
    tip.style.left = x + 'px'; tip.style.top = '0px';
    tip.classList.add('show');
    wrap.querySelectorAll('.hit').forEach(h => h.setAttribute('fill', h === e.target ? 'rgba(127,127,127,.08)' : 'transparent'));
  };
  wrap.querySelectorAll('.hit').forEach(h => { h.addEventListener('pointerenter', show); h.addEventListener('click', show); });
  wrap.addEventListener('pointerleave', () => { tip.classList.remove('show'); wrap.querySelectorAll('.hit').forEach(h => h.setAttribute('fill', 'transparent')); });
}
function groupBy(key, list) {
  const m = new Map();
  list.forEach(p => {
    const k = p[key] || 'Sem ' + (key === 'category' ? 'categoria' : 'plataforma');
    const o = m.get(k) || { k, count: 0, rev: 0, profit: 0, cost: 0, days: 0 };
    o.count++; o.rev += p.sellPrice || 0; o.profit += profit(p); o.cost += cost(p); o.days += age(p);
    m.set(k, o);
  });
  return [...m.values()].sort((a, b) => b.profit - a.profit);
}
function hbars(rows) {
  const max = Math.max(...rows.map(r => Math.abs(r.profit)), 1);
  return rows.map(r => `
    <div class="hbar">
      <div class="top-l"><span>${esc(r.k)} <span class="muted">· ${r.count} ${r.count === 1 ? 'venda' : 'vendas'} · ${Math.round(r.days / r.count)}d</span></span><b class="num ${r.profit < 0 ? 'neg' : ''}">${fmt(r.profit)}</b></div>
      <div class="track"><div class="fill ${r.profit < 0 ? 'neg' : ''}" style="width:${Math.abs(r.profit) / max * 100}%"></div></div>
    </div>`).join('');
}

function saveForm(id) {
  const name = $('#fName').value.trim();
  const buyPrice = parseMoney($('#fBuy').value);
  if (!name) { $('#fName').focus(); return toast('Coloque o nome do produto'); }
  const data = {
    name,
    category: $('#fCat').value.trim(),
    platform: $('#fPlat').value,
    buyPrice,
    extraCost: parseMoney($('#fExtra').value),
    buyDate: $('#fBuyDate').value || todayStr(),
    listPrice: parseMoney($('#fList').value),
    status: formStatus,
    notes: $('#fNotes').value.trim(),
    photo: formPhoto
  };
  if (formStatus === 'vendido') {
    data.sellPrice = parseMoney($('#fSell').value) || data.listPrice;
    data.sellFee = parseMoney($('#fFee').value);
    data.sellDate = $('#fSellDate').value || todayStr();
    data.buyer = $('#fBuyer').value.trim();
  } else { data.sellPrice = 0; data.sellFee = 0; data.sellDate = ''; data.buyer = ''; }
  if (id) {
    Object.assign(S.products.find(x => x.id === id), data);
    closeSheet(); commit('Produto atualizado');
  } else {
    S.products.unshift({ id: uid(), createdAt: Date.now(), ...data });
    closeSheet(); commit(`Adicionado · ${fmt(cost(data))} no investimento`);
  }
}
function compressImage(file, max = 560, q = 0.68) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- Marcar como vendido (o "check") ---------- */
function toggleSold(id) {
  const p = S.products.find(x => x.id === id);
  if (isSold(p)) {
    openSheet(`${sheetHead('Desfazer venda?')}
      <p class="muted" style="margin-top:0">“${esc(p.name)}” volta para <b>Anunciado</b> e o lucro de ${fmt(profit(p))} sai dos relatórios.</p>
      <div class="btns"><button class="btn secondary" onclick="closeSheet()">Cancelar</button><button class="btn danger" onclick="unsell('${id}')">Desfazer venda</button></div>`);
    return;
  }
  openSheet(`${sheetHead('Marcar como vendido')}
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${thumb(p, 48)}<div><b>${esc(p.name)}</b><div class="small muted">Custo ${fmt(cost(p))} · ${age(p)} ${age(p) === 1 ? 'dia' : 'dias'} em estoque</div></div></div>
    ${moneyField('sSell', 'Vendeu por', p.listPrice)}
    <div class="two">
      ${moneyField('sFee', 'Taxas / frete', 0)}
      <div class="field"><label for="sDate">Data</label><input id="sDate" type="date" value="${todayStr()}"></div>
    </div>
    <div class="preview" id="sPrev"></div>
    <button class="btn good" onclick="confirmSell('${id}')">${ICON_CHECK.replace('<svg', '<svg width="20" height="20"')} Confirmar venda</button>`);
  const upd = () => {
    const pr = parseMoney($('#sSell').value) - parseMoney($('#sFee').value) - cost(p);
    $('#sPrev').innerHTML = `<div class="kv"><span>Lucro nessa venda</span><b class="num ${pr >= 0 ? 'pos' : 'neg'}" style="font-size:18px">${fmt(pr)}</b></div><div class="kv"><span>ROI</span><b class="num">${pct(cost(p) ? pr / cost(p) : NaN)}</b></div>`;
  };
  $('#sheet').querySelectorAll('input').forEach(i => i.addEventListener('input', upd));
  upd();
}
function confirmSell(id) {
  const p = S.products.find(x => x.id === id);
  const before = { ...p };
  p.sellPrice = parseMoney($('#sSell').value);
  p.sellFee = parseMoney($('#sFee').value);
  p.sellDate = $('#sDate').value || todayStr();
  p.status = 'vendido';
  p.soldAt = Date.now();
  closeSheet();
  const pr = profit(p);
  commit(`Vendido! ${pr >= 0 ? '+' : ''}${fmt(pr)} de lucro`, () => { Object.assign(p, before); commit('Venda desfeita'); });
}
function unsell(id) {
  const p = S.products.find(x => x.id === id);
  Object.assign(p, { status: 'anunciado', sellPrice: 0, sellFee: 0, sellDate: '', buyer: '' });
  closeSheet(); commit('Venda desfeita');
}

    </div>
    <div class="grid" style="margin-bottom:6px">

    <div class="kv"><span>Pagou</span><b class="num">${fmt(p.buyPrice)}</b></div>
    ${p.extraCost ? `<div class="kv"><span>Custos extras</span><b class="num">${fmt(p.extraCost)}</b></div>` : ''}
    <div class="kv"><span>Investimento total</span><b class="num">${fmt(cost(p))}</b></div>
    <div class="kv"><span>Preço anunciado</span><b class="num">${p.listPrice ? fmt(p.listPrice) : '—'}</b></div>
    ${sold ? `
      <div class="kv"><span>Vendido por</span><b class="num">${fmt(p.sellPrice)}</b></div>
      ${p.sellFee ? `<div class="kv"><span>Taxas na venda</span><b class="num">${fmt(p.sellFee)}</b></div>` : ''}

      ${p.listPrice && p.sellPrice !== p.listPrice ? `<div class="kv"><span>Desconto dado</span><b class="num">${fmt(p.listPrice - p.sellPrice)}</b></div>` : ''}
    ` : ''}
    <div class="kv"><span>Data da compra</span><b>${fmtDateLong(p.buyDate)}</b></div>
    ${p.notes ? `<div class="preview" style="margin-top:10px;white-space:pre-wrap">${esc(p.notes)}</div>` : ''}
    <div class="stack" style="margin-top:14px">
      ${!sold ? `<button class="btn good" onclick="toggleSold('${p.id}')">Marcar como vendido</button>` : ''}
      ${!sold ? `<div class="btns" style="margin:0">${['estoque', 'anunciado', 'reservado'].filter(s => s !== p.status).map(s => `<button class="btn secondary small" style="flex:1" onclick="setProdStatus('${p.id}','${s}')">→ ${STATUS[s]}</button>`).join('')}</div>` : ''}
      <div class="btns" style="margin:0">
        <button class="btn secondary" onclick="openForm('${p.id}')">Editar</button>
        <button class="btn secondary" onclick="duplicate('${p.id}')">Duplicar</button>
      </div>
      ${sold ? `<button class="btn secondary" onclick="toggleSold('${p.id}')">Desfazer venda</button>` : ''}
      <button class="btn danger" onclick="delProduct('${p.id}')">Excluir produto</button>
    </div>`);
}
function setProdStatus(id, s) { S.products.find(x => x.id === id).status = s; closeSheet(); commit('Status: ' + STATUS[s]); }
function duplicate(id) {
  const p = S.products.find(x => x.id === id);
  const c = { ...p, id: uid(), createdAt: Date.now(), status: 'anunciado', sellPrice: 0, sellFee: 0, sellDate: '', buyer: '', buyDate: todayStr() };
  S.products.unshift(c); closeSheet(); commit('Produto duplicado'); openForm(c.id);
}
function delProduct(id) {
  const i = S.products.findIndex(x => x.id === id);
  const [p] = S.products.splice(i, 1);
  closeSheet();
  commit('Produto excluído', () => { S.products.splice(i, 0, p); commit('Restaurado'); });
}

/* ---------- Caixa, meta, configurações ---------- */

function setTheme(t) {
  S.settings.theme = t; applyTheme(); commit();
}
function applyTheme() {
  const t = S.settings.theme === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.appTheme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0b0c0f' : '#ffffff';
}

/* ---------- Backup ---------- */
async function download(name, content, type) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) {
      try { const r = await dl.save({ filename: name, data: content }); if (r.status === 'saved') toast('Arquivo salvo'); }
      catch (e) { if (e && e.code === 'unavailable') toast('Não foi possível salvar o arquivo aqui'); }
      return;
    }
  } catch (e) {}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportJSON() { download(`brick-backup-${todayStr()}.json`, JSON.stringify(S), 'application/json'); }
function exportCSV() {
  const cols = ['Nome', 'Categoria', 'Plataforma', 'Status', 'Data compra', 'Pagou', 'Custos extras', 'Investimento', 'Preço anunciado', 'Data venda', 'Vendeu por', 'Taxas', 'Lucro', 'Dias', 'Comprador', 'Observações'];
  const n = v => (v || 0).toFixed(2).replace('.', ',');
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = S.products.map(p => [p.name, p.category, p.platform, STATUS[p.status], p.buyDate, n(p.buyPrice), n(p.extraCost), n(cost(p)), n(p.listPrice), p.sellDate, isSold(p) ? n(p.sellPrice) : '', isSold(p) ? n(p.sellFee) : '', isSold(p) ? n(profit(p)) : '', age(p), p.buyer, p.notes].map(q).join(';'));
  download(`brick-produtos-${todayStr()}.csv`, '\ufeff' + [cols.map(q).join(';'), ...rows].join('\n'), 'text/csv');
}
$('#fileImport').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.products)) throw 0;
    S = { ...S, ...d, settings: { ...S.settings, ...(d.settings || {}) } };
    S.cash = S.cash || [];
    applyTheme(); commit(`Backup importado · ${S.products.length} produtos`);
  } catch (err) { toast('Arquivo inválido'); }
  e.target.value = '';
});

/* ---------- Toast ---------- */
let toastT = null;
function toast(msg, undo) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Desfazer</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { el.classList.remove('show'); undo(); };
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 2400);
}
